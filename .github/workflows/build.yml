name: Build

on:
    push:
        branches:
            - main
    pull_request:


jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: '21'
                    cache: gradle

            -   name: Generate test RSA keys
                run: |
                    mkdir -p config/keys
                    openssl genpkey -algorithm RSA -out config/keys/private.pem -pkeyopt rsa_keygen_bits:2048
                    openssl rsa -pubout -in config/keys/private.pem -out config/keys/public.pem

            -   name: Run tests
                run: ./gradlew test --info

            -   name: Run detekt
                run: ./gradlew detekt --info

            -   name: Generate JaCoCo report
                run: ./gradlew jacocoTestReport --info

            -   name: Sonar analysis
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                    SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
                run: ./gradlew sonar --info
