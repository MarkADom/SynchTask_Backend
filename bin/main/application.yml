spring:
  datasource:
    url: jdbc:mysql://localhost:3306/synchtask
    username: root
    password: NewStrongPass123!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

  output:
    ansi:
      enabled: ALWAYS

  redis:
    host: redis-13286.c82.us-east-1-2.ec2.redns.redis-cloud.com
    port: 13286
    password: MLuGzCo0YG2IB2FD0FjDtzWWlK7yYSQf
    database: 0
    timeout: 5000
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2
        time-between-eviction-runs: 60000
    pubsub:
      chat-topic: "chat-messages"
      notification-topic: "notifications"
      task-topic: tasks
    cache:
      type: redis
      redis:
        time-to-live: 3600000
        cache-null-values: false
        key-prefix: "synchtask::"
    repositories:
            enabled: false

  management:
    endpoint:
      redis:
        enabled: true
    endpoints:
      web:
        exposure:
          include: "redis"

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 948445819041-kl3qq6ahg76vjo6nvlclh9608k85248g.apps.googleusercontent.com
            client-secret: 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
            scope: openid, profile, email
            redirect-uri: http://localhost:8081/api/login/oauth2/code/google
        provider:
          google:
            issuer-uri: https://accounts.google.com
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
          jwk-set-uri: http://localhost:8081/jwks
          audiences: synchtask-clients

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    persistAuthorization: true
    oauth:
      clientId: synchtask-client
      clientSecret: synchtask-secret


ratelimiter:
  user:
    limit: 100
    window: 1
  anon:
    limit: 50
    window: 1
  public:
    limit: 200
    window: 1

server:
  port: 8081
  tomcat:
    max-threads: 200
    accept-count: 100
    connection-timeout: 30s
    compression:
      enabled: true
      min-response-size: 512
      mime-types: application/json,application/xml,text/html,text/xml,text/plain

management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    mappings:
      enabled: true
  security:
    enabled: false

jwt:
  expiration: 900000 # 15 minutes
  refreshExpiration: 86400000 # 24 hours
  issuer: synchtask-api
  audience: synchtask-clients
  algorithm: RS256


websocket:
  enabled: true
  broker:
    prefix: /topic
  app:
    prefix: /app
  heartbeat:
    send-interval: 100000
    receive-interval: 10000

cors:
  allowed:
    origins:
      - "http://localhost:8082"
      - "http://127.0.0.1:8082"
      - "http://localhost:3000"
      - "capacitor://localhost"
      - "http://your-mobile-expo-url"
      - "https://your-app.com"
    # TODO: Replace * with exact domains in production (e.g. https://your-app.com)

logging:
  level:
    root: INFO
    io.swagger: DEBUG # Logs do Swagger
    org.springdoc: DEBUG # Logs do SpringDoc OpenAPI
    com.synchtask: DEBUG
    io.lettuce.core: DEBUG                   # Log Redis activity
    org.hibernate.SQL: DEBUG                # Log SQL queries
    org.hibernate.type.descriptor.sql: TRACE # Log SQL parameters
    # org.springframework: DEBUG
    # org.springframework.boot: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data: DEBUG
    org.springframework.context: DEBUG
    org.springframework.core.env: DEBUG
    org.springframework.security: TRACE
    org.springframework.jdbc.core: DEBUG
    org.springframework.messaging: DEBUG  # Log STOMP messages
    org.springframework.web.socket: DEBUG   # Log WebSocket activity
    org.springframework.data.redis: DEBUG
    org.springframework.web.client: DEBUG  # Log HTTP client requests (RestTemplate)
    org.springframework.transaction: DEBUG
    org.springframework.beans.factory: DEBUG
    org.springframework.data.redis.connection: DEBUG
    org.springframework.web.client.RestTemplate: TRACE
    org.springframework.jdbc.datasource.DataSourceTransactionManager: DEBUG
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG



