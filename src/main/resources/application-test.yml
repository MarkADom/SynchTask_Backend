spring:
    datasource:
        url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: sa
        password:
    
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: false
        open-in-view: false
        database-platform: org.hibernate.dialect.H2Dialect
    
    data:
        redis:
            host: localhost
            port: 6379
            repositories:
                enabled: false
    
    security:
        oauth2:
            client:
                registration: {}
            resourceserver:
                jwt:
                    issuer-uri: http://test
                    jwk-set-uri: http://test/jwks

server:
    port: 0

websocket:
    enabled: false

synchtask:
    redis:
        pubsub:
            chat-topic: test-chat
            notification-topic: test-notification
            task-topic: test-task
